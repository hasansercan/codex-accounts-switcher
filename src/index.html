<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Codex Accounts</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <a class="skip" href="#content">İçeriğe geç</a>
    <aside>
      <div class="brand">
        <img src="icon.png" alt="" width="36" height="36" />
        <div>Codex Accounts<small>WINDOWS</small></div>
      </div>
      <nav aria-label="Ana menü">
        <button data-page="accounts" aria-current="page">
          <span data-icon="users"></span>Hesaplar</button
        ><button data-page="auto">
          <span data-icon="switch"></span>Otomatik geçiş</button
        ><button data-page="otp">
          <span data-icon="shield"></span>2FA dönüştürücü</button
        ><button data-page="settings">
          <span data-icon="settings"></span>Giriş ve uygulama
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local">
          <span class="status-dot"></span>Bu bilgisayarda saklanır
        </div>
        <small>Codex Accounts 1.3.0<br />Bağımsız, açık kaynak uygulama</small
        ><button id="quit" class="quiet">Uygulamadan çık</button>
      </div>
    </aside>
    <div class="workspace">
      <header>
        <span id="breadcrumb">Hesaplar</span>
        <div class="header-actions">
          <span id="status" role="status"></span
          ><button id="refresh"><span data-icon="refresh"></span>Yenile</button
          ><button id="add" class="primary">
            <span data-icon="plus"></span>Hesap ekle
          </button>
        </div>
      </header>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <div id="pending" role="status" hidden></div>
      <main id="content" tabindex="-1" aria-busy="true"></main>
      <footer>
        <span>Resmî Codex giriş akışı</span
        ><span>Şifrelerin bu uygulama tarafından alınmaz.</span>
      </footer>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="dialog-head">
        <h2 id="modal-title"></h2>
        <button id="close-modal" aria-label="Pencereyi kapat">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-error" role="alert" hidden></div>
    </dialog>
    <script src="renderer.js" type="module"></script>
  </body>
</html>
